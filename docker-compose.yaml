# Local dev stack: Supabase (Postgres, Auth, REST, Studio) plus Qdrant.
# Throwaway credentials, localhost only - do not deploy this.
#
#   Supabase API   http://localhost:54321   (supabase-js / supabase-py URL)
#   Postgres       postgresql://postgres:postgres@localhost:54322/postgres
#   Studio         http://localhost:54323
#   Qdrant         http://localhost:6333    (dashboard at /dashboard)

name: meal-planner

# Each dev's own secret and API keys, read from .env (not committed).
# Create it once with: python3 scripts/gen-env.py
x-keys:
  jwt_secret: &jwt_secret ${SUPABASE_JWT_SECRET:?missing - run python3 scripts/gen-env.py}
  anon_key: &anon_key ${SUPABASE_ANON_KEY:?missing - run python3 scripts/gen-env.py}
  service_role_key: &service_role_key ${SUPABASE_SERVICE_ROLE_KEY:?missing - run python3 scripts/gen-env.py}

services:
  db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - db_config:/etc/postgresql-custom
    configs:
      - source: db_roles
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_JWT_SECRET: *jwt_secret
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v14.17
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt_secret

  # API gateway: one URL for the Supabase clients, routing /auth/v1 and /rest/v1.
  kong:
    image: kong/kong:3.9.3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
    ports:
      - "127.0.0.1:54321:8000"
    configs:
      - source: kong
        target: /kong.yml

  meta:
    image: supabase/postgres-meta:v0.99.0
    environment:
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: postgres

  studio:
    image: supabase/studio:2026.09.07-sha-7996410
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: postgres
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:54321
      SUPABASE_ANON_KEY: *anon_key
      SUPABASE_SERVICE_KEY: *service_role_key
      AUTH_JWT_SECRET: *jwt_secret
    ports:
      - "127.0.0.1:54323:3000"

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

configs:
  # The image creates these roles without passwords; auth and rest log in as them.
  db_roles:
    content: |
      ALTER USER authenticator WITH PASSWORD 'postgres';
      ALTER USER supabase_auth_admin WITH PASSWORD 'postgres';

  kong:
    content: |
      _format_version: "3.0"
      services:
        - name: auth
          url: http://auth:9999/
          routes:
            - name: auth
              paths: [/auth/v1/]
        - name: rest
          url: http://rest:3000/
          routes:
            - name: rest
              paths: [/rest/v1/]
      plugins:
        - name: cors

volumes:
  db_data:
  db_config:
  qdrant_data:
