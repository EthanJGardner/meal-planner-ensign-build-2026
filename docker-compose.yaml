name: meal-planner

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
